<!DOCTYPE html>
<html lang="en">
<head>
    <title>Responsive Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

<h1>Driving License</h1>

<!-- FORM -->
<form id="details">
    <label>Name:</label>
    <input type="text" id="name" required><br><br>

    <label>Email:</label>
    <input type="email" id="mail" required><br><br>

    <label>Phone no:</label>
    <input type="number" id="phone" required><br><br>

    <label>Age:</label>
    <input type="number" id="age" required><br><br>

    <label>Gender:</label>
    <input type="text" id="gender" required><br><br>

    <label>Address:</label>
    <input type="text" id="address" required><br><br>

    <label>Photo:</label>
    <input type="file" id="image" accept="image/*" required><br><br>

    <button type="submit">Submit</button>
</form>

<!-- RESULT SECTION -->
<h2>License Details</h2>

<div class="result-container">

    <!-- LEFT SIDE -->
    <div class="details">
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <p id="p4"></p>
        <p id="p5"></p>
        <p id="p6"></p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="photo">
        <img id="dp" width="200px">
    </div>

</div>

<script src="form.js"></script>

</body>
</html>
