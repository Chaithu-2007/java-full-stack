<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #chocolate
        {
            width:1cm;
            height: 1cm;
            position:relative;
            background-color:goldenrod ;
            border-style: double;
            
            
        }
    </style>
</head>
<body>
     <div id="chocolate">
        
  
     </div>
     <p> mouse over the space</p>
     <script>
        const box=document.getElementById("chocolate");
        let x=100;
        let y=100;
        const step=10;
        document.addEventListener("keydown",function(keys){
            if (keys.code=="ArrowDown"){
              y+=step;  
            }
            if (keys.code=="ArrowUp"){
              y-=step;  
            }
            if (keys.code=="ArrowRight"){
              x+=step;  
            }
            if (keys.code=="ArrowLeft"){
              x-=step;  
            }
            box.style.left=x+"px"
            box.style.top=y+"px"
        });
        const asha=document.getElementById("chocolate");
        asha.addEventListener("mouseover",function ()
    {
        asha.style.backgroundColor="chocolate";
        asha.innerText="Dark chocolate";

    });
    asha.addEventListener("mouseout",function(){
        asha.style.backgroundColor="green";
        asha.innerText="Kacha Mango";

    });

     </script>
</body>
</html>
